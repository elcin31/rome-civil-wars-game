name: Publish verified Android ZIP
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android APK run with a successful build job
        required: true
        default: ''
      candidate:
        description: Publish an explicitly marked intermediate candidate with open Android smoke
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      PUBLISH_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Require a successful main build
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs" > jobs.json
          python - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['head_branch'] == 'main'
          assert run['name'] == 'Android APK'
          jobs = json.load(open('jobs.json'))['jobs']
          assert any(j['name'] == 'build' and j['conclusion'] == 'success' for j in jobs)
          if os.environ['PUBLISH_CANDIDATE'] == 'true':
              assert run['conclusion'] in ['success', 'failure']
              assert all(j['conclusion'] == 'success' or
                         (j['name'] == 'android-smoke' and j['conclusion'] == 'failure') for j in jobs)
          else:
              assert run['conclusion'] == 'success'
          PY
      - uses: actions/download-artifact@v4.3.0
        with:
          name: cinis-lauri-android-arm64
          path: delivery
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the exact delivery bytes
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from zipfile import ZipFile
          run = json.load(open('run.json'))
          info = json.load(open('delivery/build-info.json'))
          assert info['commit'] == run['head_sha']
          assert re.fullmatch(r'[0-9a-f]{40}', info['commit'])
          assert info['package'] == 'org.cinislauri.game'
          assert info['version'] == '0.5.0' and info['abi'] == 'arm64-v8a'
          assert info['min_sdk'] == 24 and info['target_sdk'] == 36
          apk = Path('delivery/cinis-lauri.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == info['sha256']
          archives = list(Path('delivery').glob('rome-civil-wars-*.zip'))
          assert len(archives) == 1
          archive = archives[0]
          with ZipFile(archive) as z:
              assert {'cinis-lauri.apk', 'README_INSTALL.txt', 'build-info.json'} <= set(z.namelist())
              assert hashlib.sha256(z.read('cinis-lauri.apk')).hexdigest() == info['sha256']
              assert json.loads(z.read('build-info.json')) == info
          archive.with_name(archive.name + '.sha256').write_text(
              hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('RELEASE_COMMIT=' + info['commit'] + '\n')
          PY
      - name: Publish in this repository
        run: |
          release_flags=()
          release_title='CINIS LAURI 0.5.0 — Android'
          if [ "$PUBLISH_CANDIDATE" = 'true' ]; then
            release_flags+=(--prerelease --latest=false)
            release_title='CINIS LAURI 0.5.0 — предварительная сборка'
          fi
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease > existing-release.json; then
            python - <<'PY'
          import json, os
          release = json.load(open('existing-release.json'))
          assert release['tagName'] == 'v0.5.0'
          assert release['isPrerelease'] == (os.environ['PUBLISH_CANDIDATE'] == 'true')
          PY
            git fetch --no-tags --depth=1 origin refs/tags/v0.5.0:refs/tags/v0.5.0
            [[ "$(git rev-parse 'v0.5.0^{commit}')" == "$RELEASE_COMMIT" ]]
            gh release upload v0.5.0 --repo "$GITHUB_REPOSITORY" delivery/rome-civil-wars-*.zip delivery/rome-civil-wars-*.zip.sha256
          else
            gh release create v0.5.0 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "$release_title" --notes-file docs/RELEASE_NOTES_v0.5.0.md "${release_flags[@]}" delivery/rome-civil-wars-*.zip delivery/rome-civil-wars-*.zip.sha256
          fi
