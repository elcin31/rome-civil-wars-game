name: Native touch probe
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: Run containing the cinis-smoke-x86 artifact
        required: true
        default: '39137572752'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: cinis-smoke-x86
          path: smoke
          run-id: ${{ inputs.apk_run }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python -m pip install 'Pillow>=10.4,<13'
      - uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: python tools/android_smoke.py smoke/cinis-smoke.apk
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: native-touch-evidence
          path: build/android-smoke
